            - label: Nordrhein-Westfalen
              value: nordrhein-westfalen
            - label: Rheinland-Pfalz
              value: rheinland-pfalz
            - label: Saarland
              value: saarland
            - label: Sachsen
              value: sachsen
            - label: Sachsen-Anhalt
              value: sachsen-anhalt
            - label: Schleswig-Holstein
              value: schleswig-holstein
