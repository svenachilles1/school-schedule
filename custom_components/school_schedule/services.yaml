      required: false
      example: monday-4
      selector:
        text:
    subject:
      name: Fach
      description: Neues Fach.
      required: false
      example: Deutsch
      selector:
        text:
    room:
      name: Raum
      description: Neuer Raum.
      required: false
      example: R101
      selector:
        text:
    teacher:
      name: Lehrer
      description: Neuer Lehrer.
      required: false
      example: Frau Schmidt
      selector:
        text:
    start_time:
      name: Startzeit
      description: Neue Startzeit (HH:MM).
      required: false
      example: "09:00"
      selector:
        text:
    end_time:
      name: Endzeit
      description: Neue Endzeit (HH:MM).
      required: false
      example: "09:45"
      selector:
        text:
    color:
      name: Farbe
      description: Neuer Hex-Farbcode.
      required: false
      example: "#33aa55"
      selector:
        text:
    icon:
      name: Icon
      description: Neues MDI-Icon.
      required: false
      example: "mdi:book"
      selector:
        text:
    is_break:
      name: Pause
      description: Wenn aktiv, wird dieser Eintrag als Pause markiert.
      required: false
      selector:
        boolean:

mark_sick_day:
  name: Kranktag markieren
  description: Markiert einen Tag als Kranktag (Fehltage-Tracking). Ohne Datumsangabe gilt heute; mit Datum funktionieren Nachträge und Vormeldungen.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes, dessen Fehltag erfasst wird.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: 'Datum des Kranktags im Format JJJJ-MM-TT. Leer = heute. Auch Nachträge (gestern) und Vormeldungen (morgen) möglich.'
      required: false
      example: "2026-09-29"
      selector:
        text:
    note:
      name: Notiz
      description: Optionale Notiz zum Kranktag (z.B. "Erkältung", "Fieber").
      required: false
      example: Erkältung
      selector:
        text:

unmark_sick_day:
  name: Kranktag entfernen
  description: Entfernt die Krank-Markierung für einen Tag. Ohne Datumsangabe gilt heute.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: 'Datum im Format JJJJ-MM-TT. Leer = heute.'
      required: false
      example: "2026-09-29"
      selector:
        text:

mark_sick_range:
  name: Krankmeldung (Von–Bis)
  description: Markiert alle Tage von Start- bis Enddatum (inklusive) als krank. Beide Daten sind Pflicht.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    start_date:
      name: Von
      description: Erstes Krankdatum im Format JJJJ-MM-TT.
      required: true
      example: "2026-10-01"
      selector:
        text:
    end_date:
      name: Bis
      description: Letztes Krankdatum im Format JJJJ-MM-TT.
      required: true
      example: "2026-10-05"
      selector:
        text:
    note:
      name: Notiz
      description: Optionale Notiz für alle Tage der Krankmeldung.
      required: false
      example: "Grippe"
      selector:
        text:

update_sick_day:
  name: Kranktag bearbeiten
  description: Aktualisiert die Notiz eines bestehenden Kranktags. Der Tag muss bereits als krank markiert sein.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: Krankdatum im Format JJJJ-MM-TT.
      required: true
      example: "2026-10-01"
      selector:
        text:
    note:
      name: Notiz
      description: Neue Notiz für diesen Kranktag.
      required: false
      example: "Erkältung"
      selector:
        text:

mark_lesson_cancelled:
  name: Stunde entfällt lassen
  description: Markiert eine einzelne Stunde an einem konkreten Datum als entfallen (z.B. Lehrer krank, Ausflug, Vertretungsplan) — ohne den Wochenplan zu ändern.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: Datum des Schultags im Format JJJJ-MM-TT (kein Wochenende).
      required: true
      example: "2026-10-07"
      selector:
        text:
    lesson_number:
      name: Stundennummer
      description: Nummer der ausfallenden Stunde (1-12), wie im Stundenplan.
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 12
          mode: box
    note:
      name: Notiz
      description: Optionaler Grund (z.B. "Lehrer krank", "Ausflug").
      required: false
      example: "Lehrer krank"
      selector:
        text:

unmark_lesson_cancelled:
  name: Ausfall aufheben
  description: Hebt die Entfall-Markierung einer einzelnen Stunde auf — die Stunde findet wieder statt.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: Datum im Format JJJJ-MM-TT.
      required: true
      example: "2026-10-07"
      selector:
        text:
    lesson_number:
      name: Stundennummer
      description: Nummer der Stunde (1-12).
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 12
          mode: box

mark_date_exception:
  name: Datum-Ausnahme erfassen
  description: Markiert einen konkreten Tag für dieses Kind als Ausnahme (z.B. Klassenfahrt, Schulfest, Halbtag) — ohne den Wochenplan zu ändern.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: Datum des Schultags im Format JJJJ-MM-TT (kein Wochenende).
      required: true
      example: "2026-10-15"
      selector:
        text:
    exception_type:
      name: Art der Ausnahme
      description: "'free' = ganzer Tag ohne Unterricht (Klassenfahrt, Schulfest). 'partial' = Halbtag — Unterricht nur bis zur angegebenen Stunde, der Rest entfällt."
      required: true
      example: free
      selector:
        select:
          options:
            - label: "Ganzer Tag frei (Klassenfahrt, Schulfest)"
              value: free
            - label: "Halbtag (bis Stunde N Unterricht)"
              value: partial
    until_lesson:
      name: Letzte Stunde
      description: Nur bei 'partial' — die letzte Stunde, die noch stattfindet (1-12). Alles danach entfällt an diesem Tag.
      required: false
      example: 4
      selector:
        number:
          min: 1
          max: 12
          mode: box
    note:
      name: Notiz
      description: Optionaler Grund (z.B. "Klassenfahrt", "Zeugnisse").
      required: false
      example: "Klassenfahrt"
      selector:
        text:

mark_date_exception_range:
  name: Datum-Ausnahme (Zeitraum)
  description: Markiert jeden Tag von-bis als Ausnahme (z.B. mehrtägige Klassenfahrt) — ohne den Wochenplan zu ändern.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    start_date:
      name: Von
      description: Erstes Datum im Format JJJJ-MM-TT.
      required: true
      example: "2026-10-12"
      selector:
        text:
    end_date:
      name: Bis
      description: Letztes Datum im Format JJJJ-MM-TT (inklusiv).
      required: true
      example: "2026-10-15"
      selector:
        text:
    exception_type:
      name: Art der Ausnahme
      description: "'free' = ganzer Tag ohne Unterricht. 'partial' = Halbtag bis zur angegebenen Stunde, gilt für jeden Schultag im Zeitraum."
      required: true
      example: free
      selector:
        select:
          options:
            - label: "Ganzer Tag frei (Klassenfahrt, Schulfest)"
              value: free
            - label: "Halbtag (bis Stunde N Unterricht)"
              value: partial
    until_lesson:
      name: Letzte Stunde
      description: Nur bei 'partial' — die letzte Stunde, die noch stattfindet (1-12).
      required: false
      example: 4
      selector:
        number:
          min: 1
          max: 12
          mode: box
    note:
      name: Notiz
      description: Optionaler Grund (z.B. "Klassenfahrt nach Berlin").
      required: false
      example: "Klassenfahrt"
      selector:
        text:

unmark_date_exception:
  name: Datum-Ausnahme aufheben
  description: Entfernt die Ausnahme für den angegebenen Tag — der reguläre Stundenplan gilt wieder.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    date:
      name: Datum
      description: Datum im Format JJJJ-MM-TT.
      required: true
      example: "2026-10-15"
      selector:
        text:

get_schedule:
  name: Stundenplan abrufen
  description: Ruft den Stundenplan für einen bestimmten Wochentag ab.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    weekday:
      name: Wochentag
      description: Wochentag (optional, bei keinem Angabe wird der gesamte Plan zurückgegeben).
      required: false
      example: monday
      selector:
        select:
          options:
            - label: Montag
              value: monday
            - label: Dienstag
              value: tuesday
            - label: Mittwoch
              value: wednesday
            - label: Donnerstag
              value: thursday
            - label: Freitag
              value: friday

