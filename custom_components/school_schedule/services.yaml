add_lesson:
  name: Stunde hinzufügen
  description: Fügt eine neue Stunde zum Stundenplan hinzu.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes, dessen Stundenplan geändert wird.
      required: true
      example: Max
      selector:
        text:
    weekday:
      name: Wochentag
      description: Wochentag der Stunde.
      required: true
      example: monday
      selector:
        select:
          options:
            - label: Montag
              value: monday
            - label: Dienstag
              value: tuesday
            - label: Mittwoch
              value: wednesday
            - label: Donnerstag
              value: thursday
            - label: Freitag
              value: friday
    lesson_number:
      name: Stundennummer
      description: Nummer der Schulstunde (1-12).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 12
          mode: box
    subject:
      name: Fach
      description: Schulfach (bei Pause optional, wird automatisch zu "Pause").
      required: false
      example: Mathematik
      selector:
        text:
    room:
      name: Raum
      description: Klassenraum.
      required: false
      example: R204
      selector:
        text:
    teacher:
      name: Lehrer
      description: Name des Lehrers.
      required: false
      example: Herr Müller
      selector:
        text:
    start_time:
      name: Startzeit
      description: Startzeit der Stunde (HH:MM).
      required: true
      example: "08:00"
      selector:
        text:
    end_time:
      name: Endzeit
      description: Endzeit der Stunde (HH:MM).
      required: true
      example: "08:45"
      selector:
        text:
    color:
      name: Farbe
      description: Hex-Farbcode für die Anzeige.
      required: false
      example: "#ff5733"
      selector:
        text:
    icon:
      name: Icon
      description: MDI-Icon für die Anzeige.
      required: false
      example: "mdi:school"
      selector:
        text:
    is_break:
      name: Pause
      description: Wenn aktiv, wird dieser Eintrag als Pause markiert (kein Raum/Lehrer, eigenes Design).
      required: false
      default: false
      selector:
        boolean:
    apply_to_all_days:
      name: Auf alle Tage anwenden
      description: Wenn aktiv, wird dieser Eintrag auf alle Wochentage (Mo-Fr) angewendet.
      required: false
      default: false
      selector:
        boolean:

remove_lesson:
  name: Stunde entfernen
  description: Entfernt eine Stunde aus dem Stundenplan.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Max
      selector:
        text:
    weekday:
      name: Wochentag
      description: Wochentag der zu entfernenden Stunde.
      required: true
      example: monday
      selector:
        select:
          options:
            - label: Montag
              value: monday
            - label: Dienstag
              value: tuesday
            - label: Mittwoch
              value: wednesday
            - label: Donnerstag
              value: thursday
            - label: Freitag
              value: friday
    lesson_number:
      name: Stundennummer
      description: Nummer der zu entfernenden Stunde.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 12
          mode: box

    lesson_uid:
      name: Stunden-ID
      description: Optionale eindeutige ID der Stunde (lesson_uid aus den Sensor-Attributen). Sorgt bei mehrfach vergebenen Stundennummern für eindeutige Zuordnung (v2.5.7).
      required: false
      example: monday-4
      selector:
        text:
update_lesson:
