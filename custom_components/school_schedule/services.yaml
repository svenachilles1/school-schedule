get_schedule:
  name: Stundenplan abrufen
  description: Ruft den Stundenplan für einen bestimmten Wochentag ab.
  fields:
    child_name:
      name: Name des Kindes
      description: Name des Kindes.
      required: true
      example: Michelle
      selector:
        text:
    weekday:
      name: Wochentag
      description: Wochentag (optional, bei keinem Angabe wird der gesamte Plan zurückgegeben).
      required: false
      example: monday
      selector:
        select:
          options:
            - label: Montag
              value: monday
            - label: Dienstag
              value: tuesday
            - label: Mittwoch
              value: wednesday
            - label: Donnerstag
              value: thursday
            - label: Freitag
              value: friday